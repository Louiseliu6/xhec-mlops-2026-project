name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREFECT_HOME: ${{ runner.temp }}/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Check code and configuration
        run: uv run --no-sync pre-commit run --all-files
      - name: Test modelling and orchestration
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Verify runtime dependencies
        run: |
          uv run --no-sync python - <<'PY'
          import mlflow
          import prefect
          import pydantic
          from prefect.server.api.server import create_app

          create_app(ephemeral=True)
          print(f"Prefect {prefect.__version__}; MLflow {mlflow.__version__}; Pydantic {pydantic.__version__}")
          PY
