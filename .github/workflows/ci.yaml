name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Check code and configuration
        run: uv run --no-sync pre-commit run --all-files
      - name: Test training and inference
        run: uv run --no-sync python -m unittest discover -s tests
      - name: Verify runtime dependency
        run: uv run --no-sync python -c "from pydantic import BaseModel; print('Pydantic import OK')"
