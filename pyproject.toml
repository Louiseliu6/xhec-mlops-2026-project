[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "yunxianliu", email = "yunxian.liu1997@gmail.com" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.14",
    "matplotlib==3.9.4",
    "mlflow==2.7.1",
    "numpy==1.26.4",
    "pandas==2.1.1",
    "prefect==2.20.26",
    "pydantic>=1.10,<2",
    "scikit-learn==1.5.2",
    "setuptools==80.9.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "ipykernel==6.25.2",
    "nbclient>=0.10,<0.11",
    "nbconvert>=7,<8",
    "pre-commit==4.2.0",
    "ruff==0.12.11",
]

# This repository currently contains scripts, not an installable Python package.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
